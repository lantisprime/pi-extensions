name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The suites invoke tools via npx (tsx, typescript@6). Cold registry
      # downloads dominated CI time (7-12 min runs when npm is slow); cache
      # the npx store and warm both tools in one step.
      - name: Cache npx tool store
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-${{ runner.os }}-tsx-typescript6-v1

      - name: Warm npx tools
        run: |
          npx --yes tsx --version
          npx --yes -p typescript@6 tsc --version

      - name: Verify shared scanner vendored copies are in sync
        run: scripts/verify-shared-sync.sh

      - name: Run shared scanner smoke tests
        run: scripts/test-security-scan.mjs

      - name: Run web-search redirect/fetch unit tests
        run: web-search/test-fixtures/run-redirect-fetch-tests.sh

      - name: Run tool-context-loader tests
        run: tool-context-loader/test-fixtures/run-p1a-tests.sh

      - name: Run permission-policy classification unit tests
        run: npx --yes tsx permission-policy/test-fixtures/test-classification.ts

      - name: Run permission-policy herdr:blocked unit tests
        run: npx --yes tsx permission-policy/test-fixtures/test-herdr-blocked.ts

      - name: Run permission-policy seatAuto tests
        run: npx --yes tsx permission-policy/test-fixtures/test-seat-auto.ts

      - name: Run MCP bridge protocol tests
        run: |
          npx --yes tsx mcp/test/run-config-test.mjs
          npx --yes tsx mcp/test/run-headers-test.mjs
          npx --yes tsx mcp/test/run-client-test.mjs
          npx --yes tsx mcp/test/run-http-test.mjs

      - name: Run herdr-control tests
        run: bash herdr-control/test-fixtures/run-tests.sh

      # The agents extension had NO CI coverage until now, which is how its
      # chain schema (advertised 2..8) and its enforced cap (3) drifted apart
      # unnoticed, and how runChain's relay handoff went untested entirely.
      # Run through tsx rather than bare `node --test`: the suites import
      # ../lib/*.ts, and Node's native type stripping is still version-dependent.
      - name: Run agents tool, wiring, and chain-runner tests
        run: |
          npx --yes tsx --test agents/test/test-agents-run-tool.mjs
          npx --yes tsx --test agents/test/test-agents-run-wiring.mjs
          npx --yes tsx --test agents/test/test-chain-runner.mjs
          npx --yes tsx --test agents/test/test-bg-trust.mjs
          npx --yes tsx --test agents/test/test-bg-wake.mjs
          npx --yes tsx --test agents/test/test-builtins.mjs

      # Negative control: BREAK_VALIDATE=1 makes the tool suite assert that a
      # known-valid input is rejected. It MUST fail here, proving the guards
      # above are actually exercised.
      - name: agents validation negative control (must fail)
        run: |
          if BREAK_VALIDATE=1 npx --yes tsx --test agents/test/test-agents-run-tool.mjs; then
            echo "negative control failed: validation unexpectedly passes broken input" >&2
            exit 1
          fi

      # The agents extension carried a 32-error type backlog for its entire life
      # because nothing ever ran tsc on it. It is clean now; this step keeps it that
      # way (a second 27-error batch in index.ts was cleared after this step landed).
      # `npm ci` first: the host API's .d.ts files are a real dependency of the
      # typecheck. agents/tsconfig.json used to hardcode absolute /opt/homebrew
      # paths to a globally-installed pi, so this step could only ever pass on one
      # machine — it failed on the runner with TS2688 before this was fixed.
      - name: Typecheck agents extension
        run: |
          npm ci --prefix agents
          npx --yes -p typescript@5.9.3 tsc --noEmit -p agents/tsconfig.json

      # mcp/tsconfig.json had the same absolute /opt/homebrew paths, invisible only
      # because its typecheck was not in CI. Fixed the same way: a real pinned
      # dependency, node_modules-relative paths, and now enforced here.
      - name: Typecheck mcp extension
        run: |
          npm ci --prefix mcp
          npx --yes -p typescript@5.9.3 tsc --noEmit -p mcp/tsconfig.json
